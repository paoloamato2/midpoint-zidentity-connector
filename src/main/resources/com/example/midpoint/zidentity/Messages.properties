zidentity.connector.display=Zscaler ZIdentity

zidentity.config.tenant.display=Tenant
zidentity.config.tenant.help=Zscaler tenant name. Example: if the login URL is https://acme.zslogin.net, enter "acme".

zidentity.config.clientId.display=API Client ID
zidentity.config.clientId.help=OAuth2 API client ID created in the ZIdentity admin console.

zidentity.config.clientSecret.display=API Client Secret
zidentity.config.clientSecret.help=OAuth2 client secret associated with the API client. This value is confidential.

zidentity.config.sslVerify.display=Verify SSL Certificate
zidentity.config.sslVerify.help=Verify the TLS certificate of the Zscaler endpoints. Disable only in non-production environments.

zidentity.config.fetchGroupMemberships.display=Fetch Group Memberships
zidentity.config.fetchGroupMemberships.help=When enabled, the connector fetches the list of group memberships for every user during list operations (one extra API call per user). Disable for better performance if group memberships are managed via the Group object class.

zidentity.config.pageSize.display=Page Size
zidentity.config.pageSize.help=Number of records to retrieve per API call for paginated list endpoints (1-1000). Larger values reduce the number of round-trips for large tenants.
