# Release - Build connector JAR and publish as GitHub Release on version tag

name: Release

on:
  push:
    tags:
      - "v*.*"          # e.g. v1.0, v1.1, v2.0-beta

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Write a Maven settings.xml that adds the Evolveum Nexus repos
      # (both Nexus 2 and Nexus 3 URL formats) so that the parent POM
      # com.evolveum.polygon:connector-parent can be resolved in CI.
      - name: Configure Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0
                                        https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <profiles>
              <profile>
                <id>evolveum</id>
                <repositories>
                  <repository>
                    <id>evolveum-public</id>
                    <name>Evolveum Nexus Public</name>
                    <url>https://nexus.evolveum.com/nexus/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>evolveum-releases-v3</id>
                    <name>Evolveum Nexus Releases (Nexus 3)</name>
                    <url>https://nexus.evolveum.com/nexus/repository/releases/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>evolveum-releases-v2</id>
                    <name>Evolveum Nexus Releases (Nexus 2)</name>
                    <url>https://nexus.evolveum.com/nexus/content/repositories/releases/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>central</id>
                    <name>Maven Central</name>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>evolveum-public-plugins</id>
                    <url>https://nexus.evolveum.com/nexus/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                  <pluginRepository>
                    <id>evolveum-releases-plugins</id>
                    <url>https://nexus.evolveum.com/nexus/repository/releases/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>evolveum</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      - name: Build connector bundle
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Determine artifact path
        id: artifact
        run: |
          JAR=$(ls target/*-connector.jar | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $JAR)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ZIdentity Connector ${{ github.ref_name }}"
          body: |
            ## ZIdentity MidPoint Connector ${{ github.ref_name }}

            ### Installation
            1. Download `${{ steps.artifact.outputs.name }}` from the assets below.
            2. Copy it to your MidPoint `connid-connectors/` directory (`/opt/midpoint/var/connid-connectors/`).
            3. Restart MidPoint (or refresh the connector list in the UI).

            ### Changes
            See [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for the full commit history.
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
